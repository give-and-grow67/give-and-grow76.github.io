<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียน | Give &amp; Grow</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: Arial, "Noto Sans Thai", sans-serif;
            background: #071a2b;

            padding: 30px 15px;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            overflow-x: hidden;
            overflow-y: auto;

            position: relative;
        }

        /* วิดีโอพื้นหลัง: ปรับสีให้สดเหมือน index.html */
        #bg-video {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center center;

            filter:
                saturate(1.22)
                contrast(1.08)
                brightness(1.05);

            opacity: 1;

            z-index: 0;
            pointer-events: none;

            transform: translateZ(0);
            backface-visibility: hidden;
            will-change: transform;
        }

        /* ชั้นทับวิดีโอ: ไม่ทำให้สีมืดเกินไป */
        body::before {
            content: "";
            position: fixed;
            inset: 0;

            pointer-events: none;
            z-index: 1;

            background: rgba(0, 0, 0, 0.03);
        }

        /* แสงสีฟ้าเดิม */
        body::after {
            content: "";
            position: fixed;
            inset: 0;

            pointer-events: none;
            z-index: 1;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(0, 255, 255, 0.10),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(0, 150, 255, 0.12),
                    transparent 40%
                );
        }

        /* กล่องลงทะเบียนเดิม */
        .box {
            position: relative;
            z-index: 2;

            width: 500px;
            max-width: 100%;

            margin: 20px auto;
            padding: 35px;

            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 25px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.25),
                0 0 25px rgba(0, 220, 255, 0.12);

            opacity: 0;
            animation: contentEnter
                0.75s cubic-bezier(.2, .8, .2, 1)
                forwards;
        }

        /* หัวข้อ */
        h1 {
            text-align: center;
            color: #0078aa;
            margin-bottom: 25px;

            animation: titleEnter 0.7s ease-out 0.15s both;
        }

        /* ช่องกรอกข้อมูล */
        .group {
            margin-bottom: 15px;

            opacity: 0;
            animation: fieldEnter 0.45s ease-out both;
        }

        .group:nth-of-type(1) { animation-delay: 0.15s; }
        .group:nth-of-type(2) { animation-delay: 0.20s; }
        .group:nth-of-type(3) { animation-delay: 0.25s; }
        .group:nth-of-type(4) { animation-delay: 0.30s; }
        .group:nth-of-type(5) { animation-delay: 0.35s; }
        .group:nth-of-type(6) { animation-delay: 0.40s; }
        .group:nth-of-type(7) { animation-delay: 0.45s; }
        .group:nth-of-type(8) { animation-delay: 0.50s; }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;

            border: 2px solid #ddd;
            border-radius: 10px;

            font-size: 16px;
            font-family: inherit;

            outline: none;
            background-color: #fff;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        input:focus,
        select:focus {
            border-color: #008fc4;

            box-shadow:
                0 0 0 3px rgba(0, 143, 196, 0.15),
                0 0 12px rgba(0, 200, 255, 0.10);
        }

        /* ปุ่มลงทะเบียน */
        button {
            width: 100%;
            padding: 14px;
            margin-top: 5px;

            border: none;
            border-radius: 10px;

            background: #008fc4;
            color: white;

            font-size: 18px;
            font-weight: bold;
            font-family: inherit;

            cursor: pointer;

            box-shadow: 0 5px 14px rgba(0, 143, 196, 0.20);

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        button:hover:not(:disabled) {
            background: #00729e;
            transform: translateY(-2px);

            box-shadow:
                0 7px 18px rgba(0, 143, 196, 0.30),
                0 0 15px rgba(0, 220, 255, 0.15);
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* ลิงก์กลับหน้าหลัก */
        .back {
            display: block;
            text-align: center;
            margin-top: 15px;

            color: #0078aa;
            text-decoration: none;

            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }

        .back:hover {
            color: #00a4d6;
        }

        /* ข้อความแจ้งเตือน */
        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;

            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            display: block;
            background: #dff5e5;
            color: #18743a;
        }

        .error {
            display: block;
            background: #ffe2e2;
            color: #b00020;
        }

        /* แอนิเมชันเดิม */
        @keyframes contentEnter {
            from {
                opacity: 0;
                transform: translateY(35px) scale(0.96);
                filter: blur(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        @keyframes titleEnter {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fieldEnter {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* รองรับมือถือ */
        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }

            .box {
                padding: 25px 20px;
                margin: 10px auto;
                border-radius: 20px;
            }

            h1 {
                font-size: 28px;
            }
        }

        /* รองรับผู้ใช้ที่ลดการเคลื่อนไหว */
        @media (prefers-reduced-motion: reduce) {
            .box,
            h1,
            .group {
                animation: none;
                opacity: 1;
                filter: none;
                transform: none;
            }

            input,
            select,
            button,
            .back {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <!-- วิดีโอพื้นหลัง -->
    <video
        id="bg-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        aria-hidden="true"
    >
        <source src="background_muted.mp4" type="video/mp4">
    </video>

    <div class="box">

        <h1>ลงทะเบียน</h1>

        <form id="registerForm">

            <div class="group">
                <label for="firstName">ชื่อ</label>
                <input
                    id="firstName"
                    type="text"
                    placeholder="กรอกชื่อ"
                    required
                >
            </div>

            <div class="group">
                <label for="lastName">นามสกุล</label>
                <input
                    id="lastName"
                    type="text"
                    placeholder="กรอกนามสกุล"
                    required
                >
            </div>

            <div class="group">
                <label for="nickname">ชื่อเล่น</label>
                <input
                    id="nickname"
                    type="text"
                    placeholder="กรอกชื่อเล่น"
                    required
                >
            </div>

            <div class="group">
                <label for="school">ชื่อสถานศึกษา</label>
                <input
                    id="school"
                    type="text"
                    placeholder="กรอกชื่อสถานศึกษา"
                    required
                >
            </div>

            <div class="group">
                <label for="level">ระดับชั้น</label>

                <select id="level" required>
                    <option value="">-- เลือกระดับชั้น --</option>

                    <option>ประถมศึกษาปีที่ 1</option>
                    <option>ประถมศึกษาปีที่ 2</option>
                    <option>ประถมศึกษาปีที่ 3</option>
                    <option>ประถมศึกษาปีที่ 4</option>
                    <option>ประถมศึกษาปีที่ 5</option>
                    <option>ประถมศึกษาปีที่ 6</option>

                    <option>มัธยมศึกษาปีที่ 1</option>
                    <option>มัธยมศึกษาปีที่ 2</option>
                    <option>มัธยมศึกษาปีที่ 3</option>
                    <option>มัธยมศึกษาปีที่ 4</option>
                    <option>มัธยมศึกษาปีที่ 5</option>
                    <option>มัธยมศึกษาปีที่ 6</option>
                </select>
            </div>

            <div class="group">
                <label for="age">อายุ</label>
                <input
                    id="age"
                    type="number"
                    min="1"
                    max="100"
                    placeholder="กรอกอายุ"
                    required
                >
            </div>

            <div class="group">
                <label for="email">อีเมล</label>
                <input
                    id="email"
                    type="email"
                    placeholder="example@email.com"
                    required
                >
            </div>

            <div class="group">
                <label for="phone">เบอร์โทรศัพท์</label>
                <input
                    id="phone"
                    type="text"
                    placeholder="กรอกเบอร์โทรศัพท์ หรือ -"
                    required
                >
            </div>

            <button type="submit" id="submitButton">
                ลงทะเบียน
            </button>

            <div id="message" class="message"></div>

        </form>

        <a href="index.html" class="back">
            ← กลับหน้าหลัก
        </a>

    </div>

    <script>
        // URL Web App ระบบลงทะเบียนเดิม
        const SCRIPT_URL =
            "https://script.google.com/macros/s/AKfycbyhsCJSGgvfyIM05HtWiPCGDnv7Lnm6l2M3U2vtpcV9czP5F5m2e5vkPSaci6w--jOr/exec";

        const form = document.getElementById("registerForm");
        const button = document.getElementById("submitButton");
        const message = document.getElementById("message");

        // เริ่มเล่นวิดีโอพื้นหลัง
        const video = document.getElementById("bg-video");

        video.play().catch(() => {
            // เบราว์เซอร์บางตัวอาจรอให้ผู้ใช้โต้ตอบก่อน
        });

        // เมื่อกดลงทะเบียน
        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const data = {
                firstName: document.getElementById("firstName").value.trim(),
                lastName: document.getElementById("lastName").value.trim(),
                nickname: document.getElementById("nickname").value.trim(),
                school: document.getElementById("school").value.trim(),
                level: document.getElementById("level").value,
                age: document.getElementById("age").value,
                email: document.getElementById("email").value.trim(),
                phone: document.getElementById("phone").value.trim()
            };

            button.disabled = true;
            button.textContent = "กำลังบันทึก...";

            showMessage("กำลังบันทึกข้อมูล...", "success");

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    showMessage("ลงทะเบียนสำเร็จแล้ว 🎉", "success");
                    form.reset();
                } else {
                    showMessage(
                        result.message || "ไม่สามารถบันทึกข้อมูลได้",
                        "error"
                    );
                }

            } catch (error) {
                console.error(error);

                showMessage(
                    "เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาตรวจสอบ Web App",
                    "error"
                );

            } finally {
                button.disabled = false;
                button.textContent = "ลงทะเบียน";
            }
        });

        // แสดงข้อความแจ้งเตือน
        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
        }
    </script>

</body>
</html>
