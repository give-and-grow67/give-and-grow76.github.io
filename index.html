<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Give &amp; Grow</title>

  <style>
    /* =========================
       พื้นฐาน
       ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    /* =========================
       วิดีโอพื้นหลัง
       ========================= */

    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;

      filter: saturate(1.22) contrast(1.08) brightness(1.05);

      opacity: 1;
      z-index: 0;
      pointer-events: none;

      transform: translateZ(0);
      backface-visibility: hidden;
      will-change: transform;
    }

    /* =========================
       ชั้นทับวิดีโอ
       ========================= */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.03);
      z-index: 1;
      pointer-events: none;
    }

    /* =========================
       พื้นที่ปุ่ม
       ========================= */

    .menu {
      position: relative;
      z-index: 2;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: clamp(15px, 3vw, 50px);
      padding: 20px;
    }

    /* =========================
       ปุ่มแต่ละปุ่ม
       ========================= */

    .menu-button {
      display: block;
      position: relative;

      width: min(27vw, 360px);
      max-width: 360px;
      min-width: 0;

      border: none;
      outline: none;
      background: transparent;

      cursor: pointer;
      text-decoration: none;

      transform-style: preserve-3d;
      will-change: transform, filter;

      transition:
        transform 0.25s cubic-bezier(.2, .8, .2, 1),
        filter 0.25s ease;

      -webkit-tap-highlight-color: transparent;
    }

    /* =========================
       รูปบนปุ่ม
       ========================= */

    .menu-button img {
      display: block;
      width: 100%;
      height: auto;

      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;

      filter:
        drop-shadow(0 8px 0 rgba(0, 0, 0, 0.18))
        drop-shadow(0 14px 18px rgba(0, 0, 0, 0.22));

      transition: filter 0.25s ease;
    }

    /* =========================
       เอฟเฟกต์ตอนเอาเมาส์ชี้
       ========================= */

    .menu-button:hover {
      transform:
        perspective(800px)
        translateY(-14px)
        translateZ(25px)
        rotateX(5deg)
        scale(1.06);

      filter: brightness(1.08);
    }

    .menu-button:hover img {
      filter:
        drop-shadow(0 15px 0 rgba(0, 0, 0, 0.15))
        drop-shadow(0 0 18px rgba(0, 240, 255, 0.85))
        drop-shadow(0 25px 25px rgba(0, 0, 0, 0.3));
    }

    /* =========================
       เอฟเฟกต์ตอนกด
       ========================= */

    .menu-button:active {
      transform:
        perspective(800px)
        translateY(4px)
        scale(0.94);

      filter: brightness(0.95);
      transition: transform 0.08s ease;
    }

    /* =========================
       เอฟเฟกต์เด้ง
       ========================= */

    @keyframes popupBounce {
      0% {
        transform: translateY(0) scale(1);
      }

      35% {
        transform: translateY(-17px) scale(1.07);
      }

      60% {
        transform: translateY(3px) scale(0.98);
      }

      80% {
        transform: translateY(-5px) scale(1.02);
      }

      100% {
        transform: translateY(0) scale(1);
      }
    }

    .menu-button.bounce {
      animation: popupBounce 0.48s ease;
    }

    /* =========================
       แสงสีบนวิดีโอ
       ========================= */

    .menu::before {
      content: "";
      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(255, 255, 255, 0.04),
          transparent 55%
        );

      z-index: -1;
    }

    /* =========================
       หน้าจอขนาดเล็ก
       ========================= */

    @media (max-width: 900px) {
      .menu {
        gap: 16px;
      }

      .menu-button {
        width: 30vw;
      }
    }

    /* =========================
       หน้าจอแคบ
       ========================= */

    @media (max-width: 600px) {
      .menu {
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        padding: 15px;
      }

      .menu-button {
        width: min(65vw, 260px);
      }

      .menu-button:hover {
        transform: translateY(-5px) scale(1.03);
      }
    }

    /* =========================
       แจ้งเตือนเมื่อหน้าจอแนวตั้ง
       ========================= */

    #rotate-notice {
      position: fixed;
      inset: 0;
      z-index: 99999;

      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      padding: 24px;
      text-align: center;
      color: #fff;

      background:
        radial-gradient(
          circle at 50% 20%,
          #075985,
          #071a2b 75%
        );
    }

    #rotate-notice.show {
      display: flex;
    }

    #rotate-notice .rotate-phone {
      font-size: clamp(48px, 10vw, 65px);
      animation: rotate-notice-icon 1.5s ease-in-out infinite;
    }

    #rotate-notice h2 {
      font-size: clamp(20px, 4vw, 25px);
      color: #00e5ff;
    }

    #rotate-notice p {
      max-width: 500px;
      font-size: clamp(14px, 3vw, 17px);
      line-height: 1.6;
    }

    #rotate-notice span {
      max-width: 500px;
      font-size: clamp(12px, 2.5vw, 13px);
      line-height: 1.7;
      color: #b8eaff;
    }

    @keyframes rotate-notice-icon {
      0%, 100% {
        transform: rotate(0deg);
      }

      50% {
        transform: rotate(-90deg);
      }
    }

    /* =========================
       ลดการเคลื่อนไหว
       ========================= */

    @media (prefers-reduced-motion: reduce) {
      .menu-button,
      .menu-button img {
        transition: none;
      }

      .menu-button.bounce {
        animation: none;
      }

      #rotate-notice .rotate-phone {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!-- แจ้งเตือนให้หมุนจอ -->

  <div id="rotate-notice" role="status" aria-live="polite">
    <div class="rotate-phone" aria-hidden="true">📱</div>

    <h2>หมุนจอเป็นแนวนอน</h2>

    <p>
      เพื่อประสบการณ์การใช้งาน
      Give &amp; Grow ที่ดีที่สุด
    </p>

    <span>
      โปรดหมุนหน้าจอของคุณก่อนเริ่มใช้งาน
    </span>
  </div>

  <!-- วิดีโอพื้นหลัง -->

  <video
    id="bg-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  >
    <source src="background_muted.mp4" type="video/mp4">
    เบราว์เซอร์ของคุณไม่รองรับวิดีโอ
  </video>

  <!-- ชั้นโปร่งใส -->

  <div class="overlay"></div>

  <!-- ปุ่มเมนู -->

  <main class="menu">

    <!-- ปุ่มเข้าเกม -->

    <a
      class="menu-button"
      href="waiting-game.html"
      aria-label="เล่นเกม"
    >
      <img src="game.png" alt="Game">
    </a>

    <!-- ปุ่มลงทะเบียน -->

    <a
      class="menu-button"
      href="register.html"
      aria-label="ลงทะเบียน"
    >
      <img src="register.png" alt="Register">
    </a>

    <!-- ปุ่มแบ่งปัน -->

    <a
      class="menu-button"
      href="share.html"
      aria-label="แบ่งปัน"
    >
      <img src="share.png" alt="Share">
    </a>

  </main>

  <script>
    /* =========================
       แจ้งเตือนแนวตั้งเพียงครั้งเดียว
       ========================= */

    const rotateNotice =
      document.getElementById("rotate-notice");

    // สถานะว่าข้อความเคยแสดงแล้วหรือยัง
    let noticeShown = false;

    function checkScreenOrientation() {
      const isPortrait =
        window.matchMedia("(orientation: portrait)").matches;

      // ถ้าเคยแสดงข้อความแล้ว ห้ามแสดงซ้ำ
      if (noticeShown) return;

      // ถ้าเป็นแนวตั้ง ให้แสดงข้อความครั้งแรก
      if (isPortrait) {
        noticeShown = true;
        rotateNotice.classList.add("show");

        // ซ่อนข้อความหลัง 10 วินาที
        setTimeout(() => {
          rotateNotice.classList.remove("show");
        }, 10000);
      }
    }

    // ตรวจสอบตอนเปิดเว็บไซต์
    checkScreenOrientation();

    // ตรวจสอบเมื่อขนาดหน้าต่างเปลี่ยน
    window.addEventListener(
      "resize",
      checkScreenOrientation
    );

    // ตรวจสอบเมื่อหมุนจอ
    window.addEventListener(
      "orientationchange",
      checkScreenOrientation
    );

    if (window.matchMedia) {
      const orientationQuery =
        window.matchMedia("(orientation: portrait)");

      if (orientationQuery.addEventListener) {
        orientationQuery.addEventListener(
          "change",
          checkScreenOrientation
        );
      } else if (orientationQuery.addListener) {
        orientationQuery.addListener(
          checkScreenOrientation
        );
      }
    }

    /* =========================
       ระบบเสียง
       ========================= */

    let audioContext = null;

    function getAudioContext() {
      if (!audioContext) {
        const AudioContextClass =
          window.AudioContext ||
          window.webkitAudioContext;

        if (!AudioContextClass) {
          return null;
        }

        audioContext = new AudioContextClass();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      return audioContext;
    }

    function playSound(type = "hover") {
      const ctx = getAudioContext();

      if (!ctx) return;

      const now = ctx.currentTime;
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();

      oscillator.connect(gain);
      gain.connect(ctx.destination);

      /* เสียงคลิก */

      if (type === "click") {
        oscillator.type = "sine";

        oscillator.frequency.setValueAtTime(
          650,
          now
        );

        oscillator.frequency.exponentialRampToValueAtTime(
          280,
          now + 0.09
        );

        gain.gain.setValueAtTime(0.0001, now);

        gain.gain.exponentialRampToValueAtTime(
          0.22,
          now + 0.01
        );

        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          now + 0.12
        );

        oscillator.start(now);
        oscillator.stop(now + 0.13);
      }

      /* เสียง Hover */

      else {
        oscillator.type = "sine";

        oscillator.frequency.setValueAtTime(
          850,
          now
        );

        oscillator.frequency.exponentialRampToValueAtTime(
          1100,
          now + 0.045
        );

        gain.gain.setValueAtTime(0.0001, now);

        gain.gain.exponentialRampToValueAtTime(
          0.09,
          now + 0.008
        );

        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          now + 0.065
        );

        oscillator.start(now);
        oscillator.stop(now + 0.07);
      }
    }

    /* =========================
       ปุ่มทั้งหมด
       ========================= */

    const buttons =
      document.querySelectorAll(".menu-button");

    buttons.forEach((button) => {

      // เมื่อเอาเมาส์ชี้
      button.addEventListener("mouseenter", () => {
        playSound("hover");

        button.classList.remove("bounce");

        void button.offsetWidth;

        button.classList.add("bounce");
      });

      // เมื่อกดปุ่ม
      button.addEventListener("pointerdown", () => {
        playSound("click");
      });

      // เมื่อจบ Animation
      button.addEventListener("animationend", () => {
        button.classList.remove("bounce");
      });

    });

    /* =========================
       เริ่มวิดีโอ
       ========================= */

    const video =
      document.getElementById("bg-video");

    video.play().catch(() => {
      // บางเบราว์เซอร์อาจรอให้ผู้ใช้โต้ตอบก่อน
    });
  </script>

</body>
</html>
